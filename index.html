<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mirage Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0707;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Teko',Impact,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:contain;display:block}
.touch{display:none}
@media (pointer:coarse){.touch{display:block}}
#dp{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:170px;height:170px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.03) 70%);border:2px solid rgba(255,255,255,.25);touch-action:none}
#dp i{position:absolute;color:rgba(255,255,255,.55);font:normal 26px/1 sans-serif}
#dp i:nth-child(1){left:72px;top:8px}#dp i:nth-child(2){left:72px;bottom:8px}#dp i:nth-child(3){left:10px;top:72px}#dp i:nth-child(4){right:10px;top:72px}
#btns{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:270px;height:200px}
#btns button{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font:700 21px 'Teko',Impact,sans-serif;letter-spacing:1px;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(255,255,255,.06));touch-action:none;padding:0}
#btns button.on{background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,.25));transform:scale(.94)}
#bJ{width:96px;height:96px;right:0;bottom:6px;border-color:#5ff3ff!important;box-shadow:0 0 14px rgba(95,243,255,.35)}
#bA{width:88px;height:88px;right:106px;bottom:0;border-color:#ff9a3d!important;box-shadow:0 0 16px rgba(255,154,61,.4)}
#bS{width:74px;height:74px;right:20px;bottom:108px;border-color:#ff4fd8!important;box-shadow:0 0 14px rgba(255,79,216,.4)}
#bW{width:66px;height:66px;right:112px;bottom:100px;border-color:#ffe45c!important;box-shadow:0 0 12px rgba(255,228,92,.35);font-size:19px!important}
#rot{display:none;position:fixed;inset:0;background:#0a0707;color:#fff;align-items:center;justify-content:center;text-align:center;font:700 34px 'Teko',Impact;z-index:9;padding:30px}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="dp" class="touch"><i>▲</i><i>▼</i><i>◀</i><i>▶</i></div>
<div id="btns" class="touch">
  <button id="bJ" data-k="jump">JUMP</button>
  <button id="bA" data-k="atk">HIT</button>
  <button id="bS" data-k="sp">POWER</button>
  <button id="bW" data-k="swap">SWAP</button>
</div>
<div id="rot">Rotate your phone to landscape<br>to play MIRAGE SQUAD</div>

<script>
(()=>{
'use strict';
const W=960,H=544,RES=2,TS=32,COLS=240,ROWS=17;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*RES;cv.height=H*RES;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sgn=v=>v<0?-1:1;
const TAU=Math.PI*2;
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const FONT=s=>`${s}px "Russo One",Impact,sans-serif`;
const FONT2=s=>`700 ${s}px "Teko",Impact,sans-serif`;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const r=Math.round(lerp(x>>16,y>>16,t)),g=Math.round(lerp((x>>8)&255,(y>>8)&255,t)),bl=Math.round(lerp(x&255,y&255,t));return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

/* ============================ AUDIO ============================ */
let AC=null,master=null,windOn=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);startWind();}catch(e){AC=null;}
}
function startWind(){
  if(!AC||windOn)return;windOn=true;
  const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){l=l*.97+(Math.random()*2-1)*.03;d[i]=l*6;}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.6;
  const g=AC.createGain();g.gain.value=.05;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=.03;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
function noise(dur,fq,q,gain,type,fe){
  if(!AC)return;const n=Math.max(1,AC.sampleRate*dur|0);
  const b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(fq,AC.currentTime);
  if(fe)f.frequency.exponentialRampToValueAtTime(fe,AC.currentTime+dur);f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(gain,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
function tone(f0,f1,dur,gain,type,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator();o.type=type||'square';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
const SFX={
  slash(){noise(0.14,2400,1.2,0.28,'bandpass',700);tone(rnd(700,900),300,0.08,0.1,'sawtooth')},
  bolt(){tone(rnd(900,1100),360,0.1,0.2,'square');noise(0.05,3000,1,0.12)},
  beam(){tone(160,1100,0.4,0.4,'sawtooth');tone(90,500,0.5,0.35,'square');noise(0.5,2200,1,0.4,'bandpass',300)},
  charge(){tone(200,900,0.5,0.12,'sine')},
  blink(){tone(1400,200,0.18,0.28,'sawtooth');noise(0.14,4000,1,0.25,'highpass')},
  dash(){noise(0.22,1800,1,0.4,'bandpass',500);tone(300,900,0.2,0.2,'sawtooth')},
  punch(){noise(0.16,500,0.8,0.7,'lowpass',120);tone(120,40,0.16,0.6,'triangle')},
  slam(){noise(0.6,400,0.6,1,'lowpass',50);tone(90,25,0.6,0.9,'sine')},
  hit(){const p=rnd(.85,1.2);noise(0.1,900*p,0.8,0.5,'lowpass',200);tone(200*p,70,0.1,0.35,'triangle')},
  hurt(){noise(0.22,700,0.8,0.6,'lowpass',150);tone(240,80,0.22,0.4,'sawtooth')},
  jump(){tone(260,560,0.12,0.16,'square')},
  land(){noise(0.08,300,1,0.25,'lowpass',100)},
  pick(){tone(600,1200,0.08,0.22,'square');tone(900,1800,0.1,0.22,'square',0.07)},
  ko(){noise(0.5,500,0.6,0.7,'lowpass',80);tone(200,40,0.5,0.5,'sawtooth')},
  swap(){tone(500,1000,0.08,0.22,'square');tone(750,1500,0.1,0.22,'square',0.06)},
  crumble(){noise(0.35,600,0.7,0.4,'lowpass',150)},
  rock(){noise(0.3,500,0.7,0.6,'lowpass',90);tone(110,50,0.2,0.4,'triangle')},
  check(){[0,.1,.2].forEach((d,i)=>tone(500*Math.pow(1.34,i),500*Math.pow(1.34,i)*1.02,0.14,0.22,'square',d))},
  roar(){noise(1.2,300,0.5,0.9,'lowpass',60);tone(90,40,1.2,0.6,'sawtooth');tone(130,55,1.2,0.4,'square')},
  warn(){tone(500,500,0.1,0.2,'square');tone(700,700,0.1,0.2,'square',0.14)},
  start(){tone(300,600,0.1,0.3,'square');tone(450,900,0.15,0.3,'square',0.1)},
  boom(){noise(0.5,800,0.6,0.8,'lowpass',90);tone(150,40,0.4,0.5,'sawtooth')},
  win(){[0,.14,.28,.46].forEach((d,i)=>tone(400*Math.pow(1.26,i),400*Math.pow(1.26,i)*1.01,0.2,0.25,'square',d))},
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}

/* ============================ INPUT ============================ */
const keys={};let pressed={};
function setKey(k,v){if(v&&!keys[k])pressed[k]=1;keys[k]=v?1:0;}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
  Space:'jump',KeyK:'jump',KeyZ:'jump',KeyJ:'atk',KeyX:'atk',KeyL:'sp',KeyC:'sp',KeyQ:'swap',KeyE:'swap',Tab:'swap',KeyV:'swap',
  Enter:'start',Digit1:'h1',Digit2:'h2',Digit3:'h3',Digit4:'h4'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){if(!e.repeat)setKey(k,1);e.preventDefault();initAudio();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){setKey(k,0);e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{b.setPointerCapture(e.pointerId)}catch(_){}setKey(k,1);b.classList.add('on');});
  const up=()=>{setKey(k,0);b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
const dp=document.getElementById('dp');let dpId=null;
function dpSet(e){const r=dp.getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  setKey('l',dx<-.3);setKey('r',dx>.3);setKey('u',dy<-.35);setKey('d',dy>.35);}
dp.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{dp.setPointerCapture(e.pointerId)}catch(_){}dpId=e.pointerId;dpSet(e);});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e);});
const dpUp=()=>{dpId=null;['l','r','u','d'].forEach(k=>setKey(k,0));};
dp.addEventListener('pointerup',dpUp);dp.addEventListener('pointercancel',dpUp);
const IS_TOUCH=('ontouchstart' in window);
if(IS_TOUCH)document.querySelectorAll('.touch').forEach(el=>el.style.display='block');
cv.addEventListener('pointerdown',e=>{
  initAudio();const r=cv.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);
  const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;
  onTap((e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc);
});

/* ============================ HEROES ============================ */
const HEROES=[
 {id:'kestrel',name:'KESTREL',hp:90,speed:235,jump:640,w:24,h:56,vs:.6,suit:'#16a394',suit2:'#e9f7ff',pants:'#1a2a3a',boot:'#0b141d',skin:'#e0a982',hair:'#2a1710',glow:'#7af4ff',
  desc:['Twin energy blades','Wall-climb  ·  dash-slash']},
 {id:'prism',name:'PRISM',hp:80,speed:210,jump:630,w:24,h:56,vs:.6,suit:'#f0bd35',suit2:'#ffffff',pants:'#4a2f72',boot:'#1b1030',skin:'#d9a07a',hair:'#f6e9c8',glow:'#ff5ad8',
  desc:['8-way bolts  ·  charge beam','Spread-shot power']},
 {id:'flicker',name:'FLICKER',hp:70,speed:255,jump:650,w:22,h:54,vs:.58,suit:'#7d4fff',suit2:'#d9c8ff',pants:'#241a44',boot:'#0f0a22',skin:'#cf9a78',hair:'#150f2a',glow:'#c9a8ff',
  desc:['Blinks through walls','Double jump  ·  shadow cut']},
 {id:'tremor',name:'TREMOR',hp:150,speed:168,jump:560,w:32,h:66,vs:.74,suit:'#c8642a',suit2:'#ffd08a',pants:'#3a2418',boot:'#1c110a',skin:'#b87a56',hair:'#1a0e08',glow:'#ffb347',
  desc:['Heavy punches  ·  tanky','Ground slam breaks walls']},
];
const HP=[0,0,0,0],EN=[100,100,100,100],ALIVE=[true,true,true,true];
const P={x:0,y:0,vx:0,vy:0,w:22,h:46,dir:1,hero:0};

/* ============================ LEVEL ============================ */
const TILE=[],STY=[];
for(let r=0;r<ROWS;r++){TILE.push(new Uint8Array(COLS));STY.push(new Uint8Array(COLS));}
const solidT=t=>t===1||t===4||t===5||t===6||t===8;
function tileAt(c,r){if(c<0||c>=COLS)return 1;if(r<0)return 0;if(r>=ROWS)return 0;return TILE[r][c];}
function surfRow(c,from){for(let r=from||0;r<ROWS;r++){const t=TILE[r][c];if(solidT(t)||t===2)return r;}return ROWS;}
function fill(x0,y0,x1,y1,t,s){for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){TILE[r][c]=t;STY[r][c]=s||0;}}
const ground=(x0,x1,top,s)=>fill(x0,top,x1,ROWS-1,1,s||0);
const plat=(x,y,len,s)=>fill(x,y,x+len-1,y,2,s||0);
let SPAWNS=[],PICKS=[],CPS=[],DECOR=[],crumbles=[];
const HINTS=[
 {x0:2,x1:14,text:IS_TOUCH?'Stick to move  ·  JUMP  ·  HIT  ·  POWER  ·  SWAP heroes any time':'Arrows/WASD move  ·  Space jump  ·  J hit  ·  L power  ·  Q swap heroes (or 1-4)'},
 {x0:60,x1:71,text:'Sheer cliff.   KESTREL can wall-climb it   ·   FLICKER can blink through it'},
 {x0:106,x1:118,text:'Cracked wall.   TREMOR slam   ·   PRISM charged beam   ·   FLICKER blink'},
 {x0:124,x1:130,text:'Crystals hide something.   Hold HIT as PRISM to charge a beam'},
 {x0:140,x1:146,text:'Crumbling stone.  Keep moving!'},
];
const AREAS=[[0,'THE DUNE SEA'],[58,'SCORCHED CLIFFS'],[100,'SUNKEN RUINS'],[140,'CRUMBLING BRIDGE'],[168,'THE OASIS'],[207,"SCARAB'S LAIR"]];
const BGR=[[106,7,135,13]];
const WATER=[[179,191,14]];
const ARENA_X0=207;

function buildLevel(){
  for(let r=0;r<ROWS;r++){TILE[r].fill(0);STY[r].fill(0);}
  SPAWNS=[];PICKS=[];CPS=[];DECOR=[];crumbles=[];
  // S1 dune sea
  ground(0,47,13);fill(9,12,15,12,1);fill(28,12,34,12,1);fill(30,11,33,11,1);
  plat(21,10,4);plat(37,10,4);
  ground(51,80,13);
  fill(72,3,73,12,1,2);                       // sheer cliff
  fill(81,15,95,15,3);fill(81,16,95,16,1);    // spike pit
  plat(83,11,3);plat(88,9,3);plat(92,11,3);
  ground(96,139,13);
  // S3 ruins
  fill(104,0,137,6,1,1);fill(104,7,105,8,1,1);fill(136,7,137,9,1,1);
  fill(104,13,137,13,1,1);
  fill(120,7,121,12,4,1);                     // cracked wall
  plat(109,10,3,1);plat(114,9,3,1);plat(124,10,3,1);plat(128,8,3,1);
  fill(131,10,134,12,5,1);                    // crystal cluster
  // S4 bridge
  ground(140,143,13);
  fill(144,15,167,15,3);fill(144,16,167,16,1);
  [[145,3],[150,3],[155,3],[160,3],[165,2]].forEach(([x,l])=>fill(x,13,x+l-1,13,8));
  // S5 oasis
  ground(168,178,13);ground(179,190,15);ground(191,206,13);
  // boss arena
  ground(207,239,13);fill(238,0,239,12,1,1);
  // spawns
  [['scarab',16,8],['scarab',26,6],['scorpion',40],['scarab',45,9],['scorpion',55],
   ['scorpion',62],['turret',66],['scarab',69,6],['scorpion',77],['turret',79],['scarab',86,8],['scarab',91,7],
   ['scorpion',100],['scorpion',108],['turret',112],['scarab',116,9],['turret',127],['scorpion',132],['scarab',134,9],
   ['turret',142],['scarab',148,8],['scarab',154,8],['scarab',160,8],['scarab',166,8],
   ['scorpion',172],['scarab',176,8],['scorpion',185],['turret',195],['scarab',196,8],['scorpion',201]]
   .forEach(s=>SPAWNS.push({type:s[0],c:s[1],r:s[2]}));
  [36,66,78,100,124,139,150,172,186,198].forEach(c=>PICKS.push({x:c*TS+16,y:(surfRow(c,9)*TS)-18,t:Math.random()*5,amt:30}));
  PICKS.push({x:133*TS,y:12*TS+14,t:0,amt:60});
  [56,98,139,170,203].forEach(c=>CPS.push({x:c*TS,y:surfRow(c,9)*TS,on:false,t:0}));
  // decor
  const R=mulberry(11);
  for(let c=3;c<236;){
    c+=2+Math.floor(R()*5);
    if(c>=236)break;
    if(c>=104&&c<=137)continue;
    if(c>=205&&c<=210)continue;
    const sr=surfRow(c,8);if(sr>=ROWS||sr<9||TILE[sr][c]===3)continue;
    if(c>=71&&c<=74)continue;
    if(TILE[sr][c]===8)continue;
    const inOasis=c>=168&&c<=206;
    const roll=R();let t;
    if(inOasis&&!(c>=179&&c<=190)&&roll<.55)t='palm';
    else if(inOasis&&c>=179&&c<=190)t=roll<.5?'reed':'rock';
    else if(roll<.40)t='cactus';else if(roll<.55)t='barrel';else if(roll<.72)t='rock';
    else if(roll<.82)t='dead';else if(roll<.90)t='bones';else if(c>=58&&c<=100)t='pillar';else t='cactus';
    DECOR.push({t,x:c*TS+rnd(4,28),y:sr*TS,s:.8+R()*.6,v:R(),z:R()<.25?1:0});
  }
  // a few pre-placed palms near pond rim
  [166,177,193,199].forEach(c=>{const sr=surfRow(c,8);if(sr<ROWS)DECOR.push({t:'palm',x:c*TS+16,y:sr*TS,s:1+Math.random()*.3,v:Math.random(),z:0});});
  DECOR.sort((a,b)=>a.x-b.x);
}

/* ============================ SPRITES / ATLAS ============================ */
function spr(w,h,fn){const c=document.createElement('canvas');c.width=w*RES;c.height=h*RES;const x=c.getContext('2d');x.scale(RES,RES);fn(x,w,h);return c;}
const AR=mulberry(7);
const NOISE=[],BRICK=[],CAPS=[];
let SPIKE,PLATS=[],CRUMB,CRACK,CRYS;
const ROCKCOL=[[],[],[]];
function buildAtlas(){
  for(let v=0;v<4;v++){
    NOISE.push(spr(32,32,x=>{
      for(let k=0;k<30;k++){x.fillStyle=AR()<.5?'rgba(60,20,0,.13)':'rgba(255,238,200,.15)';x.fillRect(AR()*30,AR()*30,1+AR()*2.5,1+AR()*1.6);}
      for(let k=0;k<3;k++){x.strokeStyle='rgba(70,30,10,.10)';x.lineWidth=1;x.beginPath();const yy=AR()*32;x.moveTo(0,yy);x.quadraticCurveTo(16,yy+AR()*8-4,32,yy+AR()*4-2);x.stroke();}
      if(AR()<.5){x.fillStyle='rgba(255,230,190,.2)';x.beginPath();x.ellipse(AR()*26+3,AR()*26+3,3.5,2.2,0,0,TAU);x.fill();}
    }));
    BRICK.push(spr(32,32,x=>{
      x.strokeStyle='rgba(50,28,14,.6)';x.lineWidth=1.5;
      x.beginPath();x.moveTo(0,.5);x.lineTo(32,.5);x.moveTo(0,16);x.lineTo(32,16);
      x.moveTo(0,0);x.lineTo(0,16);x.moveTo(16,0);x.lineTo(16,16);x.moveTo(8,16);x.lineTo(8,32);x.moveTo(24,16);x.lineTo(24,32);x.stroke();

/* ============================ PHYSICS ============================ */
function moveEnt(e,dt,opt){
  opt=opt||{};
  e.onGround=false;e.wallL=false;e.wallR=false;
  const pb=e.y+e.h;
  const dx=e.vx;
  e.x+=e.vx*dt;
  let c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS),r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(!solidT(tileAt(c,r)))continue;
    if(dx>0){e.x=c*TS-e.w;e.wallR=true;}else if(dx<0){e.x=(c+1)*TS;e.wallL=true;}
    e.vx=0;
  }
  const dy=e.vy;
  e.y+=e.vy*dt;
  c0=Math.floor(e.x/TS);c1=Math.floor((e.x+e.w-.01)/TS);r0=Math.floor(e.y/TS);r1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r);
    if(solidT(t)){
      if(dy>0){e.y=r*TS-e.h;e.onGround=true;if(t===8&&opt.isP)stepCrumble(c,r);}else if(dy<0){e.y=(r+1)*TS;}
      e.vy=0;
    }else if(t===2&&dy>=0&&!opt.noPlat&&pb<=r*TS+3&&e.y+e.h>r*TS){e.y=r*TS-e.h;e.vy=0;e.onGround=true;}
  }
}
function rectFree(x,y,w,h){
  const c0=Math.floor(x/TS),c1=Math.floor((x+w-.01)/TS),r0=Math.floor(y/TS),r1=Math.floor((y+h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){if(solidT(tileAt(c,r)))return false;}
  return true;
}
function stepCrumble(c,r){
  for(const k of crumbleList)if(k.c===c&&k.r===r)return;
  crumbleList.push({c,r,t:0,state:0});
}
function updateCrumbles(dt){
  for(let i=crumbleList.length-1;i>=0;i--){
    const k=crumbleList[i];k.t+=dt;
    if(k.state===0&&k.t>.5){k.state=1;k.t=0;TILE[k.r][k.c]=0;sfx('crumble');debris(k.c*TS+16,k.r*TS+16,8);}
    else if(k.state===1&&k.t>3){
      const px0=k.c*TS,py0=k.r*TS;
      if(!(P.x<px0+TS&&P.x+P.w>px0&&P.y<py0+TS&&P.y+P.h>py0)){TILE[k.r][k.c]=8;crumbleList.splice(i,1);}
    }
  }
}

function updateFX(dt){

    if(nx<cam.min||nx+P.w>COLS*TS||ny<0||ny+P.h>ROWS*TS+20)continue;
    if(rectFree(nx,ny,P.w,P.h)){best=d;break;}
  }
  if(!best){addText(P.x+P.w/2,P.y-10,'BLOCKED','#c9a8ff',22);return;}
  EN[2]-=25;
  // damage along the path
  const hs=new Set();
  for(let d=0;d<=best;d+=12){const px=c0x+dx*d,py=c0y+dy*d;rectHitEnemies(px-6,py-6,px+P.w+6,py+P.h+6,3,dx*140,-80,hs,.3);}
  for(let k=0;k<5;k++){const d=best*k/4;fx.push({k:'ghost',x:c0x+P.w/2+dx*d,y:c0y+P.h+dy*d,hero:2,dir:P.dir,anim:'idle',t:P.t,P2:snapP2(),l:.28+k*.03,m:.4});}
  P.x+=dx*best;P.y+=dy*best;if(dx)P.dir=sgn(dx);
  P.vy=dy<0?-420:Math.min(P.vy,120);P.vx=dx*180;P.inv=Math.max(P.inv,.3);P.cling=false;
  sfx('blink');ring(c0x+P.w/2,c0y+P.h/2,4,40,'#c9a8ff',.3);ring(P.x+P.w/2,P.y+P.h/2,40,4,'#ffffff',.3);spark(P.x+P.w/2,P.y+P.h/2,14,'#c9a8ff',280);
}
function slamImpact(radius,dmg){
  const cx=P.x+P.w/2,fy=P.y+P.h;sfx('slam');shake=Math.max(shake,14);hitstop=Math.max(hitstop,.07);
  fx.push({k:'shock',x:cx,y:fy,r0:10,r1:radius,c:'#ffb347',l:.45,m:.45});fx.push({k:'shock',x:cx,y:fy,r0:6,r1:radius*.6,c:'#ffffff',l:.3,m:.3});
  dust(cx,fy,16);spark(cx,fy,20,'#ffd08a',320);
  const rowC=Math.floor(fy/TS),colC=Math.floor(cx/TS),span=Math.ceil(radius/TS);
  for(let r=rowC-5;r<=rowC+1;r++)for(let c=colC-span;c<=colC+span;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS)continue;
    if(TILE[r][c]===4&&Math.abs((c+.5)*TS-cx)<radius+TS/2)breakTile(c,r);
  }
  const hs=new Set();
  rectHitEnemies(cx-radius,fy-80,cx+radius,fy+16,dmg,0,-260,hs,.9);
  for(const e of enemies){if(!e.dead&&hs.has(e)&&e.vx!==undefined)e.vx+=(e.x+e.w/2<cx?-1:1)*200;}
}
function breakTile(c,r){
  const t=TILE[r][c];if(!t)return;TILE[r][c]=0;debris(c*TS+16,r*TS+16,t===5?10:7);sfx('rock');shake=Math.max(shake,5);
  if(t===5)spark(c*TS+16,r*TS+16,10,'#ff9af0',240);
}

/* ============================ ENEMIES ============================ */
function mkScarab(cx,cy){return{kind:'scarab',x:cx-13,y:cy-10,w:26,h:20,vx:0,vy:0,ax:cx,ay:cy,hp:3,maxhp:3,flash:0,t:Math.random()*6,state:'hover',st:0,cd:rnd(.5,2),dir:-1,kx:0,ky:0,stunT:0,tx:0,ty:0,pts:100};}
function mkScorpion(x,bottom){return{kind:'scorpion',x:x,y:bottom-26,w:42,h:26,vx:0,vy:0,hp:5,maxhp:5,flash:0,t:Math.random()*6,dir:-1,state:'patrol',st:0,cd:rnd(1,2.5),stunT:0,x0:x-150,x1:x+150,pts:150};}
function mkTurret(x,bottom){return{kind:'turret',x:x,y:bottom-30,w:28,h:30,vx:0,vy:0,hp:6,maxhp:6,flash:0,t:Math.random()*6,dir:-1,state:'idle',st:0,cd:rnd(1,2),aim:Math.PI,stunT:0,pts:200};}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];if(e.dead){enemies.splice(i,1);continue;}
    const ex=e.x+e.w/2,dist=Math.abs(ex-(P.x+P.w/2));
    if(dist>W*1.1&&e.kind!=='scarab'){e.flash=Math.max(0,e.flash-dt);continue;}  // dormant offscreen
    e.t+=dt;e.st+=dt;e.cd-=dt;e.flash=Math.max(0,e.flash-dt);e.stunT=Math.max(0,e.stunT-dt);
    if(e.kind==='scarab')updScarab(e,dt);else if(e.kind==='scorpion')updScorpion(e,dt);else updTurret(e,dt);
    // contact damage
    if(e.kind!=='turret'&&P.inv<=0&&P.x+P.w-3>e.x+3&&P.x+3<e.x+e.w-3&&P.y+P.h-3>e.y+3&&P.y+3<e.y+e.h-3)hurtPlayer(e.kind==='scarab'?10:12,ex);
  }
}
function updScarab(e,dt){
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2,ecx=e.x+e.w/2,ecy=e.y+e.h/2;
  if(e.stunT>0){e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=.9;e.ky*=.9;return;}
  if(e.state==='hover'){
    const tx=e.ax+Math.sin(e.t*1.1)*60,ty=e.ay+Math.sin(e.t*2.3)*14;
    e.x+=(tx-e.w/2-e.x)*Math.min(1,dt*3);e.y+=(ty-e.h/2-e.y)*Math.min(1,dt*3);e.dir=pcx>ecx?1:-1;
    if(e.cd<=0&&Math.hypot(pcx-ecx,pcy-ecy)<300){e.state='wind';e.st=0;e.tx=pcx;e.ty=pcy;}
  }else if(e.state==='wind'){
    e.y-=30*dt;if(e.st>.4){e.state='dive';e.st=0;e.tx=pcx;e.ty=pcy;sfx('warn');}
  }else if(e.state==='dive'){
    const dx=e.tx-ecx,dy=e.ty-ecy,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*360*dt;e.y+=dy/d*360*dt;e.dir=dx>=0?1:-1;
    if(d<16||e.st>.9){e.state='return';e.st=0;}
  }else if(e.state==='return'){
    const dx=e.ax-ecx,dy=e.ay-ecy,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*210*dt;e.y+=dy/d*210*dt;
    if(d<10){e.state='hover';e.cd=rnd(1.5,3);}
  }
}
function updScorpion(e,dt){
  const pcx=P.x+P.w/2,ecx=e.x+e.w/2,dx=pcx-ecx;
  if(e.stunT>0){e.vx*=.9;}
  else if(e.state==='patrol'){
    e.vx=e.dir*55;
    const ahead=Math.floor((ecx+e.dir*(e.w/2+6))/TS),foot=Math.floor((e.y+e.h+4)/TS),body=Math.floor((e.y+e.h/2)/TS);
    if(ecx<e.x0)e.dir=1;else if(ecx>e.x1)e.dir=-1;
    if(!solidT(tileAt(ahead,foot))&&tileAt(ahead,foot)!==2||solidT(tileAt(ahead,body)))e.dir=-e.dir;
    if(e.cd<=0&&Math.abs(dx)<340&&Math.abs((P.y+P.h/2)-(e.y+e.h/2))<130){e.state='aim';e.st=0;e.dir=dx>=0?1:-1;}
  }else if(e.state==='aim'){
    e.vx=0;e.dir=dx>=0?1:-1;
    if(e.st>.5){
      const sx=ecx+e.dir*20,sy=e.y-4,t=clamp(Math.abs(dx)/260,.45,1.1);
      projs.push({x:sx,y:sy,vx:e.dir*Math.abs(dx)/t*(Math.abs(dx)>260?1:1)*.9,vy:-t*360*.6,from:'e',dmg:10,r:7,life:2.4,col:'#ff8a3a',g:620});
      sfx('bolt');e.state='patrol';e.cd=rnd(2,3.2);
    }
  }
  e.vy=Math.min(900,e.vy+1800*dt);
  moveEnt(e,dt,{});
  if(e.state==='patrol'&&(e.wallL||e.wallR))e.dir=-e.dir;
}
function updTurret(e,dt){
  const ecx=e.x+e.w/2,ecy=e.y+8,pcx=P.x+P.w/2,pcy=P.y+P.h/2,dx=pcx-ecx,dy=pcy-ecy,d=Math.hypot(dx,dy);
  if(d<420){
    const ta=Math.atan2(dy,dx);let da=ta-e.aim;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;e.aim+=da*Math.min(1,dt*6);
    if(e.state==='idle'&&e.cd<=0){e.state='charge';e.st=0;}
    else if(e.state==='charge'&&e.st>.55){
      projs.push({x:ecx+Math.cos(e.aim)*22,y:ecy+Math.sin(e.aim)*22,vx:Math.cos(e.aim)*300,vy:Math.sin(e.aim)*300,from:'e',dmg:10,r:7,life:2.6,col:'#ff5a3a',g:0});
      sfx('bolt');e.state='idle';e.cd=rnd(1.4,2);
    }
  }
}
function hurtEnemy(e,dmg,kx,ky,stun){
  if(e===boss){if(boss.state==='intro'||boss.dead)return;if(boss.state==='stun')dmg*=1.5;}
  e.hp-=dmg;e.flash=.1;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  spark(cx,cy,8,'#ffe0a0',240);ring(cx,cy,4,26,'#ffffff',.18);sfx('hit');
  addText(cx+rnd(-8,8),e.y-6,''+(Math.round(dmg*10)/10),'#fff',dmg>=4?30:22);
  hitstop=Math.max(hitstop,dmg>=4?.07:.03);shake=Math.max(shake,dmg>=4?6:2.5);
  if(e!==boss&&e.kind!=='turret'){
    e.stunT=Math.max(e.stunT||0,stun||.1);
    if(e.kind==='scarab'){e.kx=kx*2;e.ky=(ky||0)*1.2;e.state='hover';}else{e.vx+=kx;e.vy+=ky||0;}
  }
  if(e.hp<=0){e===boss?killBoss():killEnemy(e);}
}
function killEnemy(e){
  e.dead=true;const cx=e.x+e.w/2,cy=e.y+e.h/2;
  spark(cx,cy,24,'#ffb347',360);ring(cx,cy,6,50,'#ffd08a',.4);debris(cx,cy,8);sfx('boom');shake=Math.max(shake,7);
  score+=e.pts;addText(cx,cy-24,'+'+e.pts,'#ffe45c',24);
  if(Math.random()<.22)pickups.push({x:cx,y:Math.min(cy,e.y+e.h-12),t:0,amt:20});
}
function rectHitEnemies(x0,y0,x1,y1,dmg,kx,ky,hs,stun){
  let n=0;const L=(boss&&!boss.dead)?enemies.concat([boss]):enemies;
  for(const e of L){
    if(e.dead||(hs&&hs.has(e)))continue;
    if(e.x<x1&&e.x+e.w>x0&&e.y<y1&&e.y+e.h>y0){if(hs)hs.add(e);hurtEnemy(e,dmg,kx,ky,stun);n++;}
  }
  return n;
}
function destroyProjs(x0,y0,x1,y1){
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];if(p.from==='e'&&p.kind!=='wave'&&p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1){spark(p.x,p.y,6,'#7af4ff',160);projs.splice(i,1);}}
}
function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.life-=dt;
    p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    let kill=p.life<=0;
    if(p.kind==='wave'){
      // ground hugging wave: AABB
      if(p.from==='e'&&P.x<p.x+17&&P.x+P.w>p.x-17&&P.y+P.h>p.y-30&&P.y<p.y+4)hurtPlayer(p.dmg,p.x);
      if(Math.random()<dt*30)dust(p.x,p.y,1);
    }else{
      const t=tileAt(Math.floor(p.x/TS),Math.floor(p.y/TS));
      if(solidT(t)||p.y>ROWS*TS){kill=true;spark(p.x,p.y,6,p.col,150);}
      if(p.from==='p'){
        const L=(boss&&!boss.dead)?enemies.concat([boss]):enemies;
        for(const e of L){if(e.dead)continue;if(p.x+p.r>e.x&&p.x-p.r<e.x+e.w&&p.y+p.r>e.y&&p.y-p.r<e.y+e.h){hurtEnemy(e,p.dmg,p.vx*.12,-40,.1);kill=true;break;}}
      }else{
        if(p.x+p.r>P.x&&p.x-p.r<P.x+P.w&&p.y+p.r>P.y&&p.y-p.r<P.y+P.h){hurtPlayer(p.dmg,p.x);kill=true;}
      }
    }
    if(kill)projs.splice(i,1);
  }
}
function drawProjs(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of projs){
    const sx=p.x-cam.x;
    if(p.kind==='wave'){
      ctx.globalCompositeOperation='source-over';
      const g=ctx.createLinearGradient(0,p.y-34,0,p.y);g.addColorStop(0,'rgba(255,214,140,0)');g.addColorStop(1,'rgba(255,190,100,.9)');ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(sx-20,p.y);ctx.lineTo(sx-8,p.y-26);ctx.lineTo(sx,p.y-34);ctx.lineTo(sx+8,p.y-26);ctx.lineTo(sx+20,p.y);ctx.fill();
      ctx.globalCompositeOperation='lighter';continue;
    }
    const g=ctx.createRadialGradient(sx,p.y,1,sx,p.y,p.r*3);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.3,hexA(p.col,.9));g.addColorStop(1,hexA(p.col,0));
    ctx.fillStyle=g;ctx.fillRect(sx-p.r*3,p.y-p.r*3,p.r*6,p.r*6);
  }
  ctx.restore();
}

/* ============================ BOSS ============================ */
function triggerBoss(){
  bossTriggered=true;fill(206,0,206,12,1,1);cam.min=ARENA_X0*TS;cam.max=ARENA_X0*TS;
  sfx('slam');shake=14;sfx('warn');
  boss={kind:'boss',x:(ARENA_X0+22)*TS,y:13*TS-108,w:186,h:108,vx:0,vy:0,hp:90,maxhp:90,shown:90,dir:-1,state:'intro',st:0,t:0,cd:1.2,flash:0,dead:false,phase2:false,spawnT:6,last:'',cdir:-1,onGround:false,pts:3000};
  areaBanner={t:0,text:"SCARAB'S LAIR"};
  msg={t:2.4,text:'THE COLOSSUS AWAKENS'};
  sfx('roar');
}
function pickAttack(){
  const opts=['charge','spit','slam'].filter(a=>a!==boss.last);const a=opts[Math.floor(Math.random()*opts.length)];boss.last=a;
  const pcx=P.x+P.w/2,bcx=boss.x+boss.w/2;
  if(a==='charge'){boss.state='cwind';boss.st=0;boss.cdir=pcx>=bcx?1:-1;boss.dir=boss.cdir;sfx('warn');}
  else if(a==='spit'){boss.state='spit';boss.st=0;boss.shots=0;}
  else{boss.state='sdown';boss.st=0;}
}
function updateBoss(dt){
  const b=boss;b.t+=dt;b.st+=dt;b.flash=Math.max(0,b.flash-dt);b.shown+=(b.hp-b.shown)*Math.min(1,dt*3);
  const pcx=P.x+P.w/2,bcx=b.x+b.w/2,toP=pcx>=bcx?1:-1;
  if(b.dead){
    if(Math.random()<dt*14){const ex=b.x+rnd(0,b.w),ey=b.y+rnd(0,b.h);spark(ex,ey,14,'#ffb347',320);ring(ex,ey,5,46,'#ffd08a',.4);sfx('boom');shake=Math.max(shake,8);}
    b.vy=Math.min(900,b.vy+1800*dt);b.vx=0;moveEnt(b,dt,{noPlat:true});
    if(b.st>3){bossDone=true;G='win';endT=0;sfx('win');try{if(score>bestScore){bestScore=score;localStorage.setItem('miragesquad_best',''+score);}}catch(e){}}
    return;
  }
  const rage=b.hp<b.maxhp*.5;
  if(rage&&!b.phase2){b.phase2=true;b.state='stun';b.st=-.4;sfx('roar');shake=12;msg={t:2,text:'THE COLOSSUS IS ENRAGED'};spawnDrone();spawnDrone();}
  if(b.phase2&&b.state==='walk'){b.spawnT-=dt;if(b.spawnT<=0){b.spawnT=9;if(enemies.filter(e=>e.kind==='scarab'&&!e.dead).length<3)spawnDrone();}}
  switch(b.state){
    case 'intro':b.vx=0;if(b.st>1.8){b.state='walk';b.st=0;b.cd=1.2;}else if(Math.random()<dt*10){shake=Math.max(shake,5);dust(b.x+rnd(0,b.w),b.y+b.h,1);}break;
    case 'walk':b.dir=toP;b.vx=b.dir*(rage?100:72);b.cd-=dt;if(b.cd<=0)pickAttack();break;
    case 'cwind':b.vx=0;b.dir=b.cdir;if(Math.random()<dt*20)dust(b.x+rnd(0,b.w),b.y+b.h,1);if(b.st>.95){b.state='charge';b.st=0;b.vx=b.dir*(rage?640:560);sfx('charge');}break;
    case 'charge':
      b.vx=b.dir*(rage?640:560);if(Math.random()<dt*40)dust(b.x+(b.dir>0?0:b.w),b.y+b.h,1);
      if(b.wallL||b.wallR){b.vx=0;b.state='stun';b.st=0;shake=18;sfx('slam');hitstop=.1;
        for(let k=0;k<3;k++)projs.push({x:cam.x+rnd(80,W-80),y:-20,vx:0,vy:0,from:'e',dmg:12,r:14,life:3,col:'#d9a35c',g:900,kind:'rock'});}
      else if(b.st>1.6){b.vx=0;b.state='walk';b.st=0;b.cd=.8;}
      break;
    case 'stun':b.vx=0;if(b.st>1.5){b.state='walk';b.st=0;b.cd=1;}break;
    case 'spit':b.vx=0;b.dir=toP;
      if(b.shots<3&&b.st>.25+b.shots*.35){b.shots++;const sx=bcx+b.dir*80,sy=b.y+30,a=Math.atan2((P.y+P.h/2)-sy,pcx-sx)+rnd(-.12,.12);
        projs.push({x:sx,y:sy,vx:Math.cos(a)*350,vy:Math.sin(a)*350,from:'e',dmg:12,r:11,life:3,col:'#ff7a2a',g:0});sfx('bolt');spark(sx,sy,6,'#ffb347',200);}
      if(b.st>1.5){b.state='walk';b.st=0;b.cd=1;}break;
    case 'sdown':b.vx=0;if(b.st>.55){b.state='air';b.st=0;b.vy=-860;b.vx=clamp((pcx-bcx)/.95,-420,420);sfx('jump');dust(bcx,b.y+b.h,10);}break;
    case 'air':if(b.onGround&&b.st>.25){b.vx=0;b.state='land';b.st=0;shake=20;sfx('slam');hitstop=.08;
        fx.push({k:'shock',x:bcx,y:b.y+b.h,r0:10,r1:200,c:'#ffb347',l:.5,m:.5});
        for(const d of [-1,1])projs.push({x:bcx+d*96,y:b.y+b.h,vx:d*(rage?440:380),vy:0,from:'e',dmg:14,r:10,life:2,col:'#ffb347',g:0,kind:'wave'});
        dust(bcx,b.y+b.h,14);}break;
    case 'land':b.vx=0;if(b.st>.7){b.state='walk';b.st=0;b.cd=.9;}break;
  }
  b.vy=Math.min(900,b.vy+1800*dt);
  moveEnt(b,dt,{noPlat:true});
  if(b.x<ARENA_X0*TS+4){b.x=ARENA_X0*TS+4;}
  if(P.inv<=0&&P.x+P.w>b.x+10&&P.x<b.x+b.w-10&&P.y+P.h>b.y+10&&P.y<b.y+b.h)hurtPlayer(b.state==='charge'?22:14,bcx);
}
function spawnDrone(){
  const e=mkScarab(cam.x+(Math.random()<.5?60:W-60),90);e.hp=e.maxhp=2;e.pts=50;enemies.push(e);
}
function killBoss(){
  boss.dead=true;boss.st=0;boss.state='dead';boss.hp=0;projs=projs.filter(p=>p.from==='p');score+=boss.pts;
  for(const e of enemies)if(!e.dead)killEnemy(e);
  sfx('roar');shake=16;hitstop=.2;flashWhite=.8;
}

/* ============================ HERO RENDER ============================ */
const OUT='#140a0c';
function line(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=OUT;ctx.stroke();}
function poly(pts,c,stroke){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(stroke){ctx.lineWidth=2;ctx.strokeStyle=OUT;ctx.stroke();}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function limb(sx,sy,a1,a2,l1,l2,w,c1,c2){
  const ex=sx+Math.sin(a1)*l1,ey=sy+Math.cos(a1)*l1,hx=ex+Math.sin(a2)*l2,hy=ey+Math.cos(a2)*l2;
  ctx.lineCap='round';
  line(sx,sy,ex,ey,w+4,OUT);line(ex,ey,hx,hy,w*.92+4,OUT);
  line(sx,sy,ex,ey,w,c1);line(ex,ey,hx,hy,w*.92,c2);
  return{ex,ey,hx,hy};
}

  txt('FOUR HEROES  ·  ONE DESERT  ·  SWAP TO SURVIVE',W/2,212,28,'#fff','center',FONT2);
  if(Math.floor(tMenu*1.8)%2===0)txt(IS_TOUCH?'TAP TO START':'PRESS ENTER',W/2,300,40,'#fff','center');
  for(let i=0;i<4;i++)txt(HEROES[i].name,xs[i],FLOOR_Y+34,22,HEROES[i].glow,'center',FONT2);
  if(bestScore>0)txt('BEST  '+bestScore,W/2,H-16,22,'#ffe45c','center',FONT2);
  ctx.drawImage(BG.vig,0,0,W,H);
}
const FLOOR_Y=455;

/* ============================ LOOP ============================ */
function updatePlay(dt){
  let sdt=dt;if(hitstop>0){hitstop-=dt;sdt=0;}
  shake=Math.max(0,shake-dt*30);
  if(sdt>0){
    updateHero(sdt);
    updateEnemies(sdt);
    if(boss)updateBoss(sdt);
    updateProjs(sdt);updateCrumbles(sdt);
    const tx=clamp(P.x+P.w/2-W*.42+P.dir*50,cam.min,cam.max);
    cam.x+=(tx-cam.x)*Math.min(1,sdt*5);if(Math.abs(tx-cam.x)<.6)cam.x=tx;
    cam.x=clamp(cam.x,cam.min,cam.max);
  }
  updateFX(dt);
}
function update(dt){
  tMenu+=dt;
  if(G==='title'){updateFX(dt);if(pressed.start||pressed.atk||pressed.jump){startNewGame();}}
  else if(G==='play')updatePlay(dt);
  else{endT+=dt;updateFX(dt);if(boss&&G==='win')updateBoss(dt*0);
    if(endT>.6&&(pressed.start||pressed.atk||pressed.jump)){if(G==='gameover')retry();else G='title';}}
}
buildAtlas();buildBG();buildLevel();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();pressed={};
  requestAnimationFrame(frame);
}
window.__g={update,render,P,TILE,HP,EN,ALIVE,keys,setKey,startNewGame,resetRun,cam,swapTo,blink,get G(){return G},get enemies(){return enemies},get boss(){return boss},
  get score(){return score},set _pressed(v){pressed=v},slamImpact,fireBeam,breakTile,TS,COLS,ROWS,get cpIdx(){return cpIdx},get projs(){return projs},get bossTriggered(){return bossTriggered}};
requestAnimationFrame(frame);
})();
</script>
