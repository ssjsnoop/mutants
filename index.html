<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0;height:100%;background:#0a0707;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:'Teko',Impact,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
:root{--u:min(11.5vh,62px)}
@supports (height:100dvh){:root{--u:min(11.5dvh,62px)}}
.touch{display:none}
@media (pointer:coarse){.touch{display:block}}
#dp{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:calc(var(--u)*2.45);height:calc(var(--u)*2.45);touch-action:none}
#dp::before{content:'';position:absolute;inset:-16%}
#dp .a{position:absolute;box-sizing:border-box;background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.10));border:2px solid rgba(255,255,255,.42);color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font:normal calc(var(--u)*.32)/1 sans-serif;pointer-events:none}
#dp .a.on{background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.4));color:#201010}
#dp .u{left:34%;top:0;width:32%;height:38%;border-radius:10px 10px 3px 3px}
#dp .d{left:34%;bottom:0;width:32%;height:38%;border-radius:3px 3px 10px 10px}
#dp .l{left:0;top:34%;width:38%;height:32%;border-radius:10px 3px 3px 10px}
#dp .r{right:0;top:34%;width:38%;height:32%;border-radius:3px 10px 10px 3px}
#dp .h{position:absolute;box-sizing:border-box;left:34%;top:34%;width:32%;height:32%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:calc(var(--u)*5.1);height:calc(var(--u)*3.7);touch-action:none}
#btns button{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;font:700 calc(var(--u)*.34)/1 'Teko',Impact,sans-serif;letter-spacing:1px;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(255,255,255,.07));touch-action:none;padding:0;-webkit-appearance:none;appearance:none}
#btns button.on{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,.25));transform:scale(.93)}
#bA{width:calc(var(--u)*1.55);height:calc(var(--u)*1.55);right:calc(var(--u)*1.7);bottom:calc(var(--u)*.1);border-color:#ff9a3d!important;box-shadow:0 0 18px rgba(255,154,61,.45)}
#bJ{width:calc(var(--u)*1.55);height:calc(var(--u)*1.55);right:0;bottom:0;border-color:#5ff3ff!important;box-shadow:0 0 16px rgba(95,243,255,.4)}
#bS{width:calc(var(--u)*1.25);height:calc(var(--u)*1.25);right:calc(var(--u)*.05);bottom:calc(var(--u)*1.9);border-color:#ff4fd8!important;box-shadow:0 0 14px rgba(255,79,216,.45)}
#bS2{width:calc(var(--u)*1.25);height:calc(var(--u)*1.25);right:calc(var(--u)*1.4);bottom:calc(var(--u)*2.0);border-color:#b06bff!important;box-shadow:0 0 14px rgba(176,107,255,.45)}
#bW{width:calc(var(--u)*1.15);height:calc(var(--u)*1.15);right:calc(var(--u)*2.75);bottom:calc(var(--u)*2.0);border-color:#ffe45c!important;box-shadow:0 0 12px rgba(255,228,92,.4)}
#bB{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);right:calc(var(--u)*3.5);bottom:calc(var(--u)*.75);border-color:#ff7a3d!important;opacity:.5}
#btns #bS,#btns #bS2,#btns #bW,#btns #bB{font-size:calc(var(--u)*.27)}
#bB.ready{opacity:1;animation:pulse .5s infinite alternate;background:radial-gradient(circle,#fff,#ffb347);color:#3a1200}
@keyframes pulse{from{box-shadow:0 0 8px #ffb347}to{box-shadow:0 0 30px #ffe45c}}
@media (pointer:coarse) and (orientation:portrait){
  :root{--u:min(11.4vw,52px)}
  #wrap{inset:0 0 auto 0;display:block}
  canvas{width:100%;height:58vh;object-fit:cover}
  #btns{bottom:max(28px,env(safe-area-inset-bottom))}
  #dp{bottom:max(38px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="btns" class="touch">
  <button id="bA" data-k="atk">HIT</button>
  <button id="bJ" data-k="jump">JUMP</button>
  <button id="bS" data-k="sp">POW 1</button>
  <button id="bS2" data-k="sp2">POW 2</button>
  <button id="bW" data-k="swap">SWAP</button>
  <button id="bB" data-k="burst">BURST</button>
</div>
<div id="dp" class="touch"><div class="a u">▲</div><div class="a d">▼</div><div class="a l">◀</div><div class="a r">▶</div><div class="h"></div></div>

<script>
(()=>{
'use strict';
const IS_TOUCH0=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const W=960,H=544,RES=IS_TOUCH0?Math.min(1.5,Math.max(1.25,window.devicePixelRatio||1.5)):2,TS=32,COLS=240,ROWS=17;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*RES;cv.height=H*RES;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sgn=v=>v<0?-1:1;
const TAU=Math.PI*2;
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const FONT=s=>`${s}px "Russo One",Impact,sans-serif`;
const FONT2=s=>`700 ${s}px "Teko",Impact,sans-serif`;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const r=Math.round(lerp(x>>16,y>>16,t)),g=Math.round(lerp((x>>8)&255,(y>>8)&255,t)),bl=Math.round(lerp(x&255,y&255,t));return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

/* ============================ AUDIO ============================ */
let AC=null,master=null,windOn=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);startWind();}catch(e){AC=null;}
}
function startWind(){
  if(!AC||windOn)return;windOn=true;
  const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){l=l*.97+(Math.random()*2-1)*.03;d[i]=l*6;}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.6;
  const g=AC.createGain();g.gain.value=.05;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=.03;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
function noise(dur,fq,q,gain,type,fe){
  if(!AC)return;const n=Math.max(1,AC.sampleRate*dur|0);
  const b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(fq,AC.currentTime);
  if(fe)f.frequency.exponentialRampToValueAtTime(fe,AC.currentTime+dur);f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(gain,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
function tone(f0,f1,dur,gain,type,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator();o.type=type||'square';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
const SFX={
  slash(){noise(0.14,2400,1.2,0.28,'bandpass',700);tone(rnd(700,900),300,0.08,0.1,'sawtooth')},
  bolt(){tone(rnd(900,1100),360,0.1,0.2,'square');noise(0.05,3000,1,0.12)},
  beam(){tone(160,1100,0.4,0.4,'sawtooth');tone(90,500,0.5,0.35,'square');noise(0.5,2200,1,0.4,'bandpass',300)},
  charge(){tone(200,900,0.5,0.12,'sine')},
  blink(){tone(1400,200,0.18,0.28,'sawtooth');noise(0.14,4000,1,0.25,'highpass')},
  dash(){noise(0.22,1800,1,0.4,'bandpass',500);tone(300,900,0.2,0.2,'sawtooth')},
  punch(){noise(0.16,500,0.8,0.7,'lowpass',120);tone(120,40,0.16,0.6,'triangle')},
  slam(){noise(0.6,400,0.6,1,'lowpass',50);tone(90,25,0.6,0.9,'sine')},
  hit(){const p=rnd(.85,1.2);noise(0.1,900*p,0.8,0.5,'lowpass',200);tone(200*p,70,0.1,0.35,'triangle')},
  hurt(){noise(0.22,700,0.8,0.6,'lowpass',150);tone(240,80,0.22,0.4,'sawtooth')},
  jump(){tone(260,560,0.12,0.16,'square')},
  land(){noise(0.08,300,1,0.25,'lowpass',100)},
  pick(){tone(600,1200,0.08,0.22,'square');tone(900,1800,0.1,0.22,'square',0.07)},
  ko(){noise(0.5,500,0.6,0.7,'lowpass',80);tone(200,40,0.5,0.5,'sawtooth')},
  swap(){tone(500,1000,0.08,0.22,'square');tone(750,1500,0.1,0.22,'square',0.06)},
  crumble(){noise(0.35,600,0.7,0.4,'lowpass',150)},
  rock(){noise(0.3,500,0.7,0.6,'lowpass',90);tone(110,50,0.2,0.4,'triangle')},
  check(){[0,.1,.2].forEach((d,i)=>tone(500*Math.pow(1.34,i),500*Math.pow(1.34,i)*1.02,0.14,0.22,'square',d))},
  roar(){noise(1.2,300,0.5,0.9,'lowpass',60);tone(90,40,1.2,0.6,'sawtooth');tone(130,55,1.2,0.4,'square')},
  warn(){tone(500,500,0.1,0.2,'square');tone(700,700,0.1,0.2,'square',0.14)},
  start(){tone(300,600,0.1,0.3,'square');tone(450,900,0.15,0.3,'square',0.1)},
  boom(){noise(0.5,800,0.6,0.8,'lowpass',90);tone(150,40,0.4,0.5,'sawtooth')},
  win(){[0,.14,.28,.46].forEach((d,i)=>tone(400*Math.pow(1.26,i),400*Math.pow(1.26,i)*1.01,0.2,0.25,'square',d))},
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}

/* ============================ INPUT ============================ */
const keys={};let pressed={};
function setKey(k,v){if(v&&!keys[k])pressed[k]=1;keys[k]=v?1:0;}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
  Space:'jump',KeyK:'jump',KeyZ:'jump',KeyJ:'atk',KeyX:'atk',KeyL:'sp',KeyC:'sp',KeyQ:'swap',KeyE:'swap',Tab:'swap',KeyV:'swap',
  Enter:'start',KeyB:'burst',KeyR:'burst',KeyI:'sp2',KeyU:'sp2',KeyP:'pause',Escape:'pause',KeyM:'pause',Digit1:'h1',Digit2:'h2',Digit3:'h3',Digit4:'h4'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){if(!e.repeat)setKey(k,1);e.preventDefault();initAudio();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){setKey(k,0);e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{b.setPointerCapture(e.pointerId)}catch(_){}setKey(k,1);b.classList.add('on');});
  const up=()=>{setKey(k,0);b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
const dp=document.getElementById('dp');let dpId=null;
const dpArms={};['u','d','l','r'].forEach(k=>{dpArms[k]=dp.querySelector?dp.querySelector('.a.'+k):null});
function dpSet(e){const r=dp.getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  const st={l:dx<-.34,r:dx>.34,u:dy<-.34,d:dy>.34};
  for(const k in st){setKey(k,st[k]);if(dpArms[k])dpArms[k].classList.toggle('on',st[k]);}}
dp.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{dp.setPointerCapture(e.pointerId)}catch(_){}dpId=e.pointerId;dpSet(e);});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e);});
const dpUp=()=>{dpId=null;['l','r','u','d'].forEach(k=>{setKey(k,0);if(dpArms[k])dpArms[k].classList.remove('on');});};
dp.addEventListener('pointerup',dpUp);dp.addEventListener('pointercancel',dpUp);
const IS_TOUCH=IS_TOUCH0;
if(IS_TOUCH)document.querySelectorAll('.touch').forEach(el=>el.style.display='block');
const bBtn=document.getElementById('bB');
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,()=>{initAudio()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state==='suspended')AC.resume();});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  initAudio();const r=cv.getBoundingClientRect();const sc=PORTRAIT()?Math.max(r.width/W,r.height/H):Math.min(r.width/W,r.height/H);
  const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;
  onTap((e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc);
});

/* ============================ HEROES ============================ */
const HEROES=[
 {id:'kestrel',name:'KESTREL',hp:90,speed:235,jump:640,w:24,h:56,vs:.6,suit:'#16a394',suit2:'#e9f7ff',pants:'#1a2a3a',boot:'#0b141d',skin:'#e0a982',hair:'#2a1710',glow:'#7af4ff',
  desc:['Twin energy blades','Wall-climb  ·  dash-slash']},
 {id:'prism',name:'PRISM',hp:80,speed:210,jump:630,w:24,h:56,vs:.6,suit:'#f0bd35',suit2:'#ffffff',pants:'#4a2f72',boot:'#1b1030',skin:'#d9a07a',hair:'#f6e9c8',glow:'#ff5ad8',
  desc:['8-way bolts  ·  charge beam','Spread-shot power']},
 {id:'flicker',name:'FLICKER',hp:70,speed:255,jump:650,w:22,h:54,vs:.58,suit:'#7d4fff',suit2:'#d9c8ff',pants:'#241a44',boot:'#0f0a22',skin:'#cf9a78',hair:'#150f2a',glow:'#c9a8ff',
  desc:['Blinks through walls','Double jump  ·  shadow cut']},
 {id:'tremor',name:'TREMOR',hp:150,speed:168,jump:560,w:32,h:66,vs:.74,suit:'#c8642a',suit2:'#ffd08a',pants:'#3a2418',boot:'#1c110a',skin:'#b87a56',hair:'#1a0e08',glow:'#ffb347',
  desc:['Heavy punches  ·  tanky','Ground slam breaks walls']},
];
HEROES.push(
 {id:'cinder',name:'CINDER',hp:85,speed:222,jump:630,w:24,h:56,vs:.6,suit:'#d9442a',suit2:'#ffd23c',pants:'#3a1a14',boot:'#1a0a08',skin:'#d49a78',hair:'#ff7a1a',glow:'#ff7a2a',
  desc:['Fireballs  ·  burning dash','Melts cracked walls']},
 {id:'nimbus',name:'NIMBUS',hp:75,speed:245,jump:620,w:22,h:54,vs:.58,suit:'#eaf8f2',suit2:'#7fe8b8',pants:'#4a7aa8',boot:'#1b2c44',skin:'#e2b08e',hair:'#9bffd0',glow:'#8dffc4',
  desc:['Glide  ·  wind blades','Gust, updraft, twister']},
 {id:'umbra',name:'UMBRA',hp:85,speed:225,jump:640,w:24,h:56,vs:.6,suit:'#2b2a3e',suit2:'#9a98c0',pants:'#15141f',boot:'#08080e',skin:'#c8957a',hair:'#0c0b14',glow:'#ff4a78',
  desc:['Shadow blade  ·  decoys','Clones that hunt enemies']},
 {id:'warp',name:'WARP',hp:80,speed:230,jump:640,w:24,h:56,vs:.6,suit:'#2f8f3a',suit2:'#d8ff5c',pants:'#1c3a22',boot:'#0b1a0e',skin:'#d9a07a',hair:'#1c3a22',glow:'#b6ff3a',
  desc:['Portal pair  ·  snap-stab','Swap places and slam']}
);
const HP=[0,0,0,0,0,0,0,0],EN=[100,100,100,100,100,100,100,100],ALIVE=[true,true,true,true,true,true,true,true],MAXJ=[2,1,3,1,2,2,2,2];
let SQUAD=[0,1,2,3];const UNLOCKED=[true,true,true,true,false,false,false,false];
function loadUnlocks(){try{const a=JSON.parse(localStorage.getItem('miragesquad_unlocked')||'[]');if(Array.isArray(a))for(const i of a)if(i>=4&&i<8)UNLOCKED[i]=true;}catch(e){}
  try{if(/unlockall/i.test(location.search))for(let i=4;i<8;i++)UNLOCKED[i]=true;}catch(e){}}
function saveUnlocks(){try{localStorage.setItem('miragesquad_unlocked',JSON.stringify(UNLOCKED.map((u,i)=>u?i:-1).filter(i=>i>=0)));}catch(e){}}
function unlockedCount(){return UNLOCKED.filter(Boolean).length;}
function loadSquad(){let s=[];try{s=JSON.parse(localStorage.getItem('miragesquad_squad')||'[]');}catch(e){}
  s=(Array.isArray(s)?s:[]).filter((v,i,a)=>Number.isInteger(v)&&v>=0&&v<8&&UNLOCKED[v]&&a.indexOf(v)===i);
  for(let i=0;i<8&&s.length<4;i++)if(UNLOCKED[i]&&!s.includes(i))s.push(i);SQUAD=s.slice(0,4);}
function saveSquad(){try{localStorage.setItem('miragesquad_squad',JSON.stringify(SQUAD));}catch(e){}}
loadUnlocks();loadSquad();
const P={x:0,y:0,vx:0,vy:0,w:22,h:46,dir:1,hero:0};
let burst=0,noMeter=false;const PW=1.7;

/* ============================ LEVEL ============================ */
const TILE=[],STY=[];
for(let r=0;r<ROWS;r++){TILE.push(new Uint8Array(COLS));STY.push(new Uint8Array(COLS));}
const solidT=t=>t===1||t===4||t===5||t===6||t===8;
function tileAt(c,r){if(c<0||c>=COLS)return 1;if(r<0)return 0;if(r>=ROWS)return 0;return TILE[r][c];}
function surfRow(c,from){for(let r=from||0;r<ROWS;r++){const t=TILE[r][c];if(solidT(t)||t===2)return r;}return ROWS;}
function fill(x0,y0,x1,y1,t,s){for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){TILE[r][c]=t;STY[r][c]=s||0;}}
const ground=(x0,x1,top,s)=>fill(x0,top,x1,ROWS-1,1,s||0);
const plat=(x,y,len,s)=>fill(x,y,x+len-1,y,2,s||0);
let SPAWNS=[],PICKS=[],CPS=[],DECOR=[],crumbles=[],PODDEFS=[];
const HINTS=[
 {x0:2,x1:12,text:IS_TOUCH?'Tap MOVES to see every power':'Arrows/WASD · Space jump · J hit · L power · I power 2 · Q swap · B burst · P moves'},
 {x0:14,x1:30,text:'Every hero jumps differently: spin double-jump, hover, triple jump, heavy leap'},
 {x0:44,x1:57,text:'Hits and kills charge the SQUAD BURST bar.  Fill it and let it rip!'},
 {x0:60,x1:71,text:'Sheer cliff.   KESTREL can wall-climb it   ·   FLICKER can blink through it'},
 {x0:106,x1:118,text:'Cracked wall.   TREMOR slam   ·   PRISM charged beam   ·   FLICKER blink'},
 {x0:124,x1:130,text:'Crystals hide something.   Hold HIT as PRISM to charge a beam'},
 {x0:62,x1:66,text:'Something glows on a high ledge...  climb the cliff and look back'},
 {x0:131,x1:136,text:'Something is trapped inside the crystals!'},
 {x0:176,x1:192,text:'Something glimmers high above the pond...'},

const NOISE=[],BRICK=[],CAPS=[];

const LW=1024;

function buildBG(){
  const R=mulberry(23);
  BG.sky=spr(W,H,(x,w,h)=>{
    const g=x.createLinearGradient(0,0,0,H*.78);g.addColorStop(0,'#2a5a9e');g.addColorStop(.38,'#7fa9c9');g.addColorStop(.72,'#f2c68a');g.addColorStop(1,'#ffdca4');

    x.fillStyle=sg;x.fillRect(0,0,W,H);

  });
  BG.clouds=spr(LW,200,x=>{
    for(let i=0;i<9;i++){const cx=R()*LW,cy=20+R()*140,len=100+R()*180;
      for(let k=0;k<4;k++){x.fillStyle='rgba(255,236,210,'+(.10+R()*.12)+')';x.beginPath();x.ellipse(cx+(k-1.5)*len*.22,cy+R()*8,len*.28,5+R()*5,0,0,TAU);x.fill();}}
  });
  function ridge(base,amps,c1,c2,peaks){
    return spr(LW,360,(x,w,h)=>{
      const ph=amps.map(()=>R()*TAU);const pts=[];
      for(let xx=0;xx<=LW;xx+=4){let y=base;amps.forEach((a,k)=>{y+=a[1]*Math.sin(TAU*a[0]*xx/LW+ph[k]);});pts.push([xx,y]);}
      const g=x.createLinearGradient(0,base-70,0,360);g.addColorStop(0,c1);g.addColorStop(1,c2);
      x.fillStyle=g;x.beginPath();x.moveTo(0,360);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(LW,360);x.closePath();x.fill();
      x.strokeStyle='rgba(255,236,190,.35)';x.lineWidth=1.6;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
      // sun-facing slope shading
      x.fillStyle='rgba(60,20,20,.10)';
      for(let i=0;i<pts.length-3;i+=3){if(pts[i+3][1]<pts[i][1]){x.beginPath();x.moveTo(pts[i][0],pts[i][1]);x.lineTo(pts[i+3][0],pts[i+3][1]);x.lineTo(pts[i+3][0],360);x.lineTo(pts[i][0],360);x.fill();}}
      if(peaks)peaks(x,pts);
    });
  }
  BG.far=ridge(150,[[2,22],[5,10],[9,5]],'#f0b88a','#f6cd9a',(x)=>{
    // distant mesas (kept clear of tile seam)
    [[150,60,70],[430,90,52],[760,70,64]].forEach(([mx,mw,mh])=>{
      const g=x.createLinearGradient(0,150-mh,0,200);g.addColorStop(0,'#d99a76');g.addColorStop(1,'#efb98f');
      x.fillStyle=g;x.beginPath();x.moveTo(mx-mw*.7,200);x.lineTo(mx-mw*.45,150-mh+8);x.lineTo(mx-mw*.38,150-mh);x.lineTo(mx+mw*.38,150-mh);x.lineTo(mx+mw*.5,150-mh+10);x.lineTo(mx+mw*.8,200);x.closePath();x.fill();
      x.fillStyle='rgba(255,230,190,.25)';x.fillRect(mx-mw*.38,150-mh,mw*.76,3);
    });
  });
  BG.mid=ridge(205,[[3,18],[7,8],[13,4]],'#d1855f','#e29c6c',(x,pts)=>{
    // pyramid, obelisk, broken arch
    const py=(px,pw,ph)=>{x.fillStyle='#b9694e';x.beginPath();x.moveTo(px-pw,225);x.lineTo(px,225-ph);x.lineTo(px+pw,225);x.closePath();x.fill();x.fillStyle='rgba(60,20,20,.25)';x.beginPath();x.moveTo(px,225-ph);x.lineTo(px+pw,225);x.lineTo(px,225);x.closePath();x.fill();};
    py(260,70,86);py(640,46,60);
    x.fillStyle='#a85a45';x.fillRect(470,120,10,100);x.beginPath();x.moveTo(470,120);x.lineTo(475,106);x.lineTo(480,120);x.fill();
    x.fillRect(880,150,9,80);x.fillRect(905,162,9,70);x.fillRect(880,150,34,8);
  });
  BG.near=ridge(262,[[2,14],[4,9],[11,5]],'#8f4a40','#5f3335',(x,pts)=>{
    // silhouette cacti & rocks

      let yy=262;pts.forEach(p=>{if(Math.abs(p[0]-cx)<3)yy=p[1];});

      x.beginPath();x.arc(cx,yy-ch,4,0,TAU);x.fill();
    });

  BG.vig=spr(W,H,(x)=>{const g=x.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.98);g.addColorStop(0,'rgba(20,6,6,0)');g.addColorStop(1,'rgba(20,6,6,.55)');x.fillStyle=g;x.fillRect(0,0,W,H);});
}

/* ============================ PHYSICS ============================ */
function moveEnt(e,dt,opt){
  opt=opt||{};
  e.onGround=false;e.wallL=false;e.wallR=false;
  const pb=e.y+e.h;
  const dx=e.vx;
  e.x+=e.vx*dt;
  let c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS),r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(!solidT(tileAt(c,r)))continue;
    if(dx>0){e.x=c*TS-e.w;e.wallR=true;}else if(dx<0){e.x=(c+1)*TS;e.wallL=true;}
    e.vx=0;
  }
  const dy=e.vy;
  e.y+=e.vy*dt;
  c0=Math.floor(e.x/TS);c1=Math.floor((e.x+e.w-.01)/TS);r0=Math.floor(e.y/TS);r1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r);
    if(solidT(t)){
      if(dy>0){e.y=r*TS-e.h;e.onGround=true;if(t===8&&opt.isP)stepCrumble(c,r);}else if(dy<0){e.y=(r+1)*TS;}
      e.vy=0;
    }else if(t===2&&dy>=0&&!opt.noPlat&&pb<=r*TS+3&&e.y+e.h>r*TS){e.y=r*TS-e.h;e.vy=0;e.onGround=true;}
  }
}
function rectFree(x,y,w,h){
  const c0=Math.floor(x/TS),c1=Math.floor((x+w-.01)/TS),r0=Math.floor(y/TS),r1=Math.floor((y+h-.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){if(solidT(tileAt(c,r)))return false;}
  return true;
}
function stepCrumble(c,r){
  for(const k of crumbleList)if(k.c===c&&k.r===r)return;
  crumbleList.push({c,r,t:0,state:0});
}
function updateCrumbles(dt){
  for(let i=crumbleList.length-1;i>=0;i--){
    const k=crumbleList[i];k.t+=dt;
    if(k.state===0&&k.t>.5){k.state=1;k.t=0;TILE[k.r][k.c]=0;sfx('crumble');debris(k.c*TS+16,k.r*TS+16,8);}

function blink(dx,dy){

  }
  if(!best){addText(P.x+P.w/2,P.y-10,'BLOCKED','#c9a8ff',22);return;}
  EN[2]-=25;
  // damage along the path

  for(let d=0;d<=best;d+=12){const px=c0x+dx*d,py=c0y+dy*d;rectHitEnemies(px-6,py-6,px+P.w+6,py+P.h+6,3,dx*140,-80,hs,.3);}
  for(let k=0;k<5;k++){const d=best*k/4;fx.push({k:'ghost',x:c0x+P.w/2+dx*d,y:c0y+P.h+dy*d,hero:2,dir:P.dir,anim:'idle',t:P.t,P2:snapP2(),l:.28+k*.03,m:.4});}
  P.x+=dx*best;P.y+=dy*best;if(dx)P.dir=sgn(dx);
  P.vy=dy<0?-420:Math.min(P.vy,120);P.vx=dx*180;P.inv=Math.max(P.inv,.3);P.cling=false;
  sfx('blink');ring(c0x+P.w/2,c0y+P.h/2,4,40,'#c9a8ff',.3);ring(P.x+P.w/2,P.y+P.h/2,40,4,'#ffffff',.3);spark(P.x+P.w/2,P.y+P.h/2,14,'#c9a8ff',280);
  const hs2=new Set();if(rectHitEnemies(P.x-64,P.y-40,P.x+P.w+64,P.y+P.h+40,4,P.dir*200,-250,hs2,.5))fx.push({k:'shock',x:P.x+P.w/2,y:P.y+P.h,r0:6,r1:110,c:'#c9a8ff',l:.35,m:.35});
}
function slamImpact(radius,dmg){
  const cx=P.x+P.w/2,fy=P.y+P.h;sfx('slam');shake=Math.max(shake,14);hitstop=Math.max(hitstop,.07);
  fx.push({k:'shock',x:cx,y:fy,r0:10,r1:radius,c:'#ffb347',l:.45,m:.45});fx.push({k:'shock',x:cx,y:fy,r0:6,r1:radius*.6,c:'#ffffff',l:.3,m:.3});
  dust(cx,fy,16);spark(cx,fy,20,'#ffd08a',320);
  const rowC=Math.floor(fy/TS),colC=Math.floor(cx/TS),span=Math.ceil(radius/TS);
  for(let r=rowC-5;r<=rowC+1;r++)for(let c=colC-span;c<=colC+span;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS)continue;
    if(TILE[r][c]===4&&Math.abs((c+.5)*TS-cx)<radius+TS/2)breakTile(c,r);
  }

}
function breakTile(c,r){

function mkTurret(x,bottom){return{kind:'turret',x:x,y:bottom-30,w:28,h:30,vx:0,vy:0,hp:6,maxhp:6,flash:0,t:Math.random()*6,dir:-1,state:'idle',st:0,cd:rnd(1,2),aim:Math.PI,stunT:0,pts:200};}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];if(e.dead){enemies.splice(i,1);continue;}
    const ex=e.x+e.w/2,dist=Math.abs(ex-(P.x+P.w/2));
    if(dist>W*1.1&&e.kind!=='scarab'){e.flash=Math.max(0,e.flash-dt);continue;}  // dormant offscreen
    e.t+=dt;e.st+=dt;e.cd-=dt;e.flash=Math.max(0,e.flash-dt);e.stunT=Math.max(0,e.stunT-dt);
    if(e.kind==='scarab')updScarab(e,dt);else if(e.kind==='scorpion')updScorpion(e,dt);else updTurret(e,dt);
    // contact damage
    if(e.kind!=='turret'&&P.inv<=0&&P.x+P.w-3>e.x+3&&P.x+3<e.x+e.w-3&&P.y+P.h-3>e.y+3&&P.y+3<e.y+e.h-3)hurtPlayer(e.kind==='scarab'?10:12,ex);
  }
}
function updScarab(e,dt){
  const _a=aggro(e),pcx=_a[0],pcy=_a[1],ecx=e.x+e.w/2,ecy=e.y+e.h/2;
  if(e.stunT>0){e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=.9;e.ky*=.9;return;}
  if(e.state==='hover'){
    const tx=e.ax+Math.sin(e.t*1.1)*60,ty=e.ay+Math.sin(e.t*2.3)*14;
    e.x+=(tx-e.w/2-e.x)*Math.min(1,dt*3);e.y+=(ty-e.h/2-e.y)*Math.min(1,dt*3);e.dir=pcx>ecx?1:-1;
    if(e.cd<=0&&Math.hypot(pcx-ecx,pcy-ecy)<300){e.state='wind';e.st=0;e.tx=pcx;e.ty=pcy;}
  }else if(e.state==='wind'){
    e.y-=30*dt;if(e.st>.4){e.state='dive';e.st=0;e.tx=pcx;e.ty=pcy;sfx('warn');}
  }else if(e.state==='dive'){
    const dx=e.tx-ecx,dy=e.ty-ecy,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*360*dt;e.y+=dy/d*360*dt;e.dir=dx>=0?1:-1;
    if(d<16||e.st>.9){e.state='return';e.st=0;}
  }else if(e.state==='return'){
    const dx=e.ax-ecx,dy=e.ay-ecy,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*210*dt;e.y+=dy/d*210*dt;

  }
}
function updScorpion(e,dt){
  const _a=aggro(e),pcx=_a[0],ecx=e.x+e.w/2,dx=pcx-ecx;

    if(ecx<e.x0)e.dir=1;else if(ecx>e.x1)e.dir=-1;
    if(!solidT(tileAt(ahead,foot))&&tileAt(ahead,foot)!==2||solidT(tileAt(ahead,body)))e.dir=-e.dir;
    if(e.cd<=0&&Math.abs(dx)<340&&Math.abs(_a[1]-(e.y+e.h/2))<130){e.state='aim';e.st=0;e.dir=dx>=0?1:-1;}
  }else if(e.state==='aim'){

function updTurret(e,dt){
  const _a=aggro(e),ecx=e.x+e.w/2,ecy=e.y+8,pcx=_a[0],pcy=_a[1],dx=pcx-ecx,dy=pcy-ecy,d=Math.hypot(dx,dy);

function hurtEnemy(e,dmg,kx,ky,stun){

function killEnemy(e){

function rectHitEnemies(x0,y0,x1,y1,dmg,kx,ky,hs,stun){

    if(e.x<x1&&e.x+e.w>x0&&e.y<y1&&e.y+e.h>y0){if(hs)hs.add(e);hurtEnemy(e,dmg,kx,ky,stun);n++;}

}
function destroyProjs(x0,y0,x1,y1){
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];if(p.from==='e'&&p.kind!=='wave'&&p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1){spark(p.x,p.y,6,'#7af4ff',160);projs.splice(i,1);}}
}
function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.life-=dt;
    p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='rock')p.rot+=dt*9*Math.sign(p.vx||1);
    let kill=p.life<=0;
    if(p.kind==='wave'){
      // ground hugging wave: AABB
      if(p.from==='e'&&P.x<p.x+17&&P.x+P.w>p.x-17&&P.y+P.h>p.y-30&&P.y<p.y+4)hurtPlayer(p.dmg,p.x);
      if(Math.random()<dt*30)dust(p.x,p.y,1);
    }else if(p.kind==='boom'){
      p.t+=dt;p.rot+=dt*22;
      if(!p.back&&(p.t>.38||solidT(tileAt(Math.floor(p.x/TS),Math.floor(p.y/TS))))){p.back=true;p.hit=new Set();}
      if(p.back){const dx=(P.x+P.w/2)-p.x,dy=(P.y+P.h*.45)-p.y,d=Math.hypot(dx,dy)||1;p.vx=dx/d*760;p.vy=dy/d*760;if(d<26)kill=true;}

      rectHitEnemies(p.x-22,p.y-46,p.x+22,p.y+8,5,p.vx*.35,-380,p.hit,.6);
      if(Math.random()<dt*40)dust(p.x,p.y,1);
      const below=tileAt(bx,Math.floor((p.y+3)/TS));
      if(!solidT(below)&&below!==2)kill=true;
      if(solidT(tileAt(Math.floor((p.x+Math.sign(p.vx)*14)/TS),Math.floor((p.y-12)/TS))))kill=true;
    }else{
      const t=tileAt(Math.floor(p.x/TS),Math.floor(p.y/TS));
      if(p.breaker&&(t===4||t===5))breakTile(Math.floor(p.x/TS),Math.floor(p.y/TS));
      if(p.burnWall&&t===4)breakTile(Math.floor(p.x/TS),Math.floor(p.y/TS));
      if(solidT(t)||p.y>ROWS*TS){kill=true;spark(p.x,p.y,6,p.col,150);if(p.kind==='rock'){debris(p.x,p.y,8);shake=Math.max(shake,6);sfx('rock');}}

        const L=(boss&&!boss.dead)?enemies.concat([boss]):enemies;
        for(const e of L){if(e.dead)continue;if(p.hit&&p.hit.has(e))continue;if(p.x+p.r>e.x&&p.x-p.r<e.x+e.w&&p.y+p.r>e.y&&p.y-p.r<e.y+e.h){hurtEnemy(e,p.dmg,p.vx*.12,-40,.1);if(p.fire)e.burn=Math.max(e.burn||0,2.5);if(p.pierce){p.hit.add(e);}else{kill=true;break;}}}

function drawProjs(){

    if(p.cres){ctx.save();ctx.translate(sx,p.y);ctx.scale(Math.sign(p.vx)||1,1);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,p.life*3);
      ctx.fillStyle=hexA(p.col,.85);ctx.beginPath();ctx.moveTo(0,-30);ctx.quadraticCurveTo(30,0,0,30);ctx.quadraticCurveTo(13,0,0,-30);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.moveTo(2,-20);ctx.quadraticCurveTo(20,0,2,20);ctx.quadraticCurveTo(9,0,2,-20);ctx.fill();ctx.restore();ctx.globalCompositeOperation='lighter';continue;}

      ctx.globalCompositeOperation='lighter';continue;
    }
    const g=ctx.createRadialGradient(sx,p.y,1,sx,p.y,p.r*3);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.3,hexA(p.col,.9));g.addColorStop(1,hexA(p.col,0));
    ctx.fillStyle=g;ctx.fillRect(sx-p.r*3,p.y-p.r*3,p.r*6,p.r*6);
  }

function liveEnemies(){const L=(boss&&!boss.dead)?enemies.concat([boss]):enemies;return L.filter(e=>!e.dead);}
function onScr(e){return e.x+e.w>cam.x-20&&e.x<cam.x+W+20;}
function igniteRect(x0,y0,x1,y1,t){for(const e of liveEnemies())if(e.x<x1&&e.x+e.w>x0&&e.y<y1&&e.y+e.h>y0)e.burn=Math.max(e.burn||0,t);}
function groundWithin(cx,y,rows){const c=Math.floor(cx/TS),r0=Math.floor(y/TS);for(let r=r0;r<=r0+rows&&r<ROWS;r++){const t=tileAt(c,r);if(t===3)return false;if(solidT(t)||t===2)return true;}return false;}
function groundYBelow(x,y,rows){const c=Math.floor(x/TS),r0=Math.max(0,Math.floor(y/TS));for(let r=r0;r<=r0+rows&&r<ROWS;r++){const t=tileAt(c,r);if(solidT(t)||t===2)return r*TS;}return null;}
function aggro(e){
  let bx=P.x+P.w/2,by=P.y+P.h/2;
  if(decoys.length){let bd=520;const ex=e.x+e.w/2,ey=e.y+e.h/2;
    for(const d of decoys){const dd=Math.hypot(d.x-ex,d.y-26-ey);if(dd<bd){bd=dd;bx=d.x;by=d.y-26;}}}
  return [bx,by];
}

function tickBurn(dt){

/* ---- zones: ground fire & tornadoes ---- */
function updateZones(dt){
  if(zones.length>90)zones.splice(0,zones.length-90);
  let L=null;
  for(let k=zones.length-1;k>=0;k--){
    const z=zones[k];z.t+=dt;z.life-=dt;z.tick-=dt;
    if(z.life<=0){zones.splice(k,1);continue;}
    if(z.kind==='fire'){
      if(Math.random()<dt*18)parts.push({k:'s',x:z.x+rnd(0,z.w),y:z.y+z.h-2,vx:rnd(-20,20),vy:rnd(-160,-60),l:rnd(.25,.5),m:.5,c:Math.random()<.5?'#ff7a2a':'#ffd23c'});
      if(z.tick<=0){z.tick=.3;rectHitEnemies(z.x,z.y-10,z.x+z.w,z.y+z.h,1.1,0,-60,new Set(),.1);igniteRect(z.x,z.y-10,z.x+z.w,z.y+z.h,2);}
    }else if(z.kind==='tornado'){
      if(z.vx){const ax=Math.floor((z.x+Math.sign(z.vx)*z.w/2)/TS),ar=Math.floor((z.y-20)/TS);if(solidT(tileAt(ax,ar)))z.vx=0;else z.x+=z.vx*dt;}
      const cx=z.x,pr=z.big?250:135,pull=(z.big?280:180)*dt;
      if(!L)L=liveEnemies();
      for(const e of L){
        if(e.dead||e===boss||e.kind==='turret')continue;
        const ex=e.x+e.w/2,ey=e.y+e.h/2;
        if(Math.abs(ex-cx)<pr&&ey>z.y-z.h-60&&ey<z.y+30){
          const dx=cx-ex,step=clamp(dx,-pull,pull);
          if(rectFree(e.x+step,e.y,e.w,e.h))e.x+=step;
          if(e.kind==='scorpion')e.vy=Math.min(e.vy,-130);else e.y-=45*dt;
        }
      }
      destroyProjs(cx-pr*.5,z.y-z.h,cx+pr*.5,z.y+10);
      if(z.tick<=0){z.tick=.35;rectHitEnemies(cx-z.w/2,z.y-z.h,cx+z.w/2,z.y+20,z.big?2.2:1.4,0,-140,new Set(),.2);}
      if(Math.random()<dt*40){const a=rnd(0,TAU);parts.push({k:'s',x:cx+Math.cos(a)*z.w*.45,y:z.y-rnd(0,z.h),vx:Math.cos(a+1.6)*200,vy:-rnd(20,120),l:.3,m:.3,c:'#d8fff0'});}
    }
  }
}
function drawZones(){
  for(const z of zones){
    const sx=z.x-cam.x;
    if(z.kind==='fire'){
      if(sx<-90||sx>W+50)continue;
      const a=clamp(z.life/.6,0,1),n=Math.max(2,Math.round(z.w/12));
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.9;
      for(let k=0;k<n;k++){
        const f0=sx+(k+.5)*z.w/n,h=14+10*Math.sin(tMenu*14+k*1.7+z.x);
        ctx.fillStyle=k%2?'#ff7a2a':'#ffd23c';ctx.beginPath();ctx.moveTo(f0-6,z.y+z.h);ctx.quadraticCurveTo(f0-2,z.y+z.h-h*.6,f0,z.y+z.h-h);ctx.quadraticCurveTo(f0+3,z.y+z.h-h*.5,f0+6,z.y+z.h);ctx.fill();
      }

      for(let k=0;k<layers;k++){

  }
}

function shadeSlash(s){
  noMeter=true;
  rectHitEnemies(s.x-46,s.y-38,s.x+46,s.y+38,s.kind==='rush'?2.8:2.2,s.dir*140,-60,new Set(),.15);
  noMeter=false;

  if(Math.random()<.4)sfx('slash');
}
function updateShades(dt){
  for(let k=shades.length-1;k>=0;k--){
    const s=shades[k];s.t+=dt;s.life-=dt;s.cd-=dt;
    if(s.life<=0){ring(s.x,s.y,4,40,'#ff4a78',.3);spark(s.x,s.y,8,'#ff4a78',180);shades.splice(k,1);continue;}
    let tgt=(s.tgt&&!s.tgt.dead)?s.tgt:null;
    if(!tgt){
      let bd=s.kind==='rush'?700:380;
      for(const e of liveEnemies()){if(!onScr(e))continue;const d=Math.hypot(e.x+e.w/2-s.x,e.y+e.h/2-s.y);if(d<bd){bd=d;tgt=e;}}
      s.tgt=tgt;
    }
    let tx,ty;
    if(tgt){tx=tgt.x+tgt.w/2;ty=tgt.y+tgt.h/2;}
    else if(s.kind==='legion'){tx=P.x+P.w/2+Math.cos(s.off+s.t*1.6)*74;ty=P.y+P.h*.4+Math.sin(s.off+s.t*1.6)*34;}
    else{s.life=Math.min(s.life,.25);continue;}
    const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy)||1;
    if(tgt&&d<34){s.dir=dx>=0?1:-1;if(s.cd<=0){s.cd=.26;shadeSlash(s);}}
    else{const m=Math.min((s.kind==='rush'?760:560)*dt,d);s.x+=dx/d*m;s.y+=dy/d*m;if(Math.abs(dx)>4)s.dir=dx>=0?1:-1;}
  }
}
function drawShades(){

/* ---- portals (Warp) ---- */
function portalHit(r,p){return r.x<p.x+16&&r.x+r.w>p.x-16&&r.y<p.y&&r.y+r.h>p.y-60;}
function tpPlayer(to){
  const nx=to.x-P.w/2,ny=to.y-P.h;
  if(!rectFree(nx,ny,P.w,P.h))return;
  ring(P.x+P.w/2,P.y+P.h/2,4,44,'#ffffff',.3);
  P.x=nx;P.y=ny;P.portalCD=.7;P.inv=Math.max(P.inv,.2);P.cling=false;sfx('blink');
  ring(P.x+P.w/2,P.y+P.h/2,44,4,'#ffffff',.3);spark(P.x+P.w/2,P.y+P.h/2,12,'#b6ff3a',260);
}
function portalUpdate(dt){
  P.portalCD=Math.max(0,(P.portalCD||0)-dt);
  if(!portal.a)return;
  portal.t+=dt;
  if(portal.t>10){portal.a=null;portal.b=null;return;}
  const A=portal.a,B=portal.b;if(!B)return;
  if(P.portalCD<=0&&portalHit(P,A))tpPlayer(B);
  for(const e of liveEnemies()){
    e.pcd=Math.max(0,(e.pcd||0)-dt);
    if(e===boss||e.kind==='turret'||e.pcd>0||!portalHit(e,A))continue;
    const nx=B.x-e.w/2,ny=B.y-e.h;
    if(rectFree(nx,ny,e.w,e.h)){
      ring(e.x+e.w/2,e.y+e.h/2,4,36,'#ff9a2a',.25);
      e.x=nx;e.y=ny;e.vx=0;e.vy=0;e.pcd=1.2;
      if(e.kind==='scarab'){e.ax=nx+e.w/2;e.ay=ny+e.h/2-20;e.state='hover';}
      ring(B.x,B.y-30,36,4,'#4ab8ff',.25);sfx('blink');
    }
  }
  for(const p of projs){
    p.pcd=Math.max(0,(p.pcd||0)-dt);
    if(p.pcd>0||(p.kind&&p.kind!=='fireball'))continue;
    if(p.x>A.x-18&&p.x<A.x+18&&p.y>A.y-62&&p.y<A.y+2){p.x=B.x;p.y=B.y-30;p.pcd=.4;ring(B.x,B.y-30,4,30,'#4ab8ff',.25);}
  }
}
function drawPortals(){
  if(!portal.a)return;
  const fade=portal.t>8?clamp((10-portal.t)/2,0,1):1;
  for(const [p,col,col2] of [[portal.a,'#ff9a2a','#ffe0a0'],[portal.b,'#4ab8ff','#c8ecff']]){
    if(!p)continue;const sx=p.x-cam.x;if(sx<-60||sx>W+60)continue;
    glowAt(sx,p.y-30,60,col,.7*fade);

    for(let k=0;k<3;k++){const ph=tMenu*3+k*2.1;ctx.strokeStyle=k?col2:col;ctx.lineWidth=4-k;ctx.beginPath();ctx.ellipse(0,0,13+Math.sin(ph)*2,30+Math.cos(ph)*2,0,0,TAU);ctx.stroke();}
    ctx.restore();
  }
}

function updatePlay(dt){
  let sdt=dt;if(hitstop>0){hitstop-=dt;sdt=0;}
  shake=Math.max(0,shake-dt*30);
  if(sdt>0){
    updateHero(sdt);updateClones(sdt);updateNew(sdt);
    updateEnemies(sdt);
    if(boss)updateBoss(sdt);
    updateProjs(sdt);updateCrumbles(sdt);
    const _v=VIS(),tx=clamp(P.x+P.w/2-(_v.ox+_v.vw*(_v.port?.36:.42))+P.dir*(_v.port?30:50),cam.min,cam.max);
    cam.x+=(tx-cam.x)*Math.min(1,sdt*5);if(Math.abs(tx-cam.x)<.6)cam.x=tx;
    cam.x=clamp(cam.x,cam.min,cam.max);
  }
  updateFX(dt);
}
function update(dt){
  tMenu+=dt;
  if(bBtn&&bBtn.classList)bBtn.classList.toggle('ready',burst>=100&&G==='play');
  if(G==='title'){updateFX(dt);if(pressed.start||pressed.atk||pressed.jump){beginRun();}}
  else if(G==='play'){if(pressed.pause){G='pause';pauseHero=P.hero;sfx('swap');}else updatePlay(dt);}
  else if(G==='select'){updateSelect(dt);}
  else if(G==='pause'){if(pressed.pause||pressed.start){G='play';sfx('swap');}}
  else{endT+=dt;updateFX(dt);if(boss&&G==='win')updateBoss(dt*0);
    if(endT>.6&&(pressed.start||pressed.atk||pressed.jump)){if(G==='gameover')retryOrSelect();else G='title';}}
}

}
